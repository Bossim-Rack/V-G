<section class="contacte-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="contact-form">
                    <div contact-header text-center py-3>
                        <h2>Contact</h2>
                    </div>
                    <div class="contact-description-form">
                        <p>Vous souhaitez nous contacter? envoyer nous un mail</p>
                    </div>
                    <div class="contact-body p-4">
                        <form id="contact-form">
                            <div class="g-3 mb-3">
                                <div class="col-6">
                                    <label for="email" class="form-label"> Votre email :</label>
                                    <input type="email" id="ins-Email" name="email" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label for="objet" class="form-label"> Objet :</label>
                                    <input type="text" id="ins-title-contact" name="title" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label"> votre message :</label>
                                <input type="text" name="message" id="ins-message-contact" class="form-control" style="height: 150px" required>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>

</section>

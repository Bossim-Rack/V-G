<section class="cx-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="cx-form">
                    <div class="cx-header text-center py-3">
                        <h2 class="cx-title">Mot de passe oublié</h2>
                    </div>
                    <div class="cx-body p-4">

                        <p class="text-center">Renseignez votre email et votre nouveau mot de passe.</p>

                        <form id="mdp-oublie-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Identifiant / Email :</label>
                                <input type="email" name="email" id="mdp-Email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="Password" class="form-label">Nouveau mot de passe :</label>
                                <div class="contain-Password-input">
                                    <input type="password" id="mdp-Password" name="Password" class="form-control" required>
                                    <button type="button" class="btn-hide-password" id="btn-hide-Password"><i class="bi bi-eye"></i></button>
                                </div>
                                <div id="strength-bar" class="ins-strength"></div>
                            </div>

                            <div class="mb-4">
                                <label for="ConfirmPassword" class="form-label">Confirmer le nouveau mot de passe :</label>
                                <div class="contain-ConfirmPassword-input">
                                    <input type="password" id="mdp-ConfirmPassword" name="ConfirmPassword" class="form-control" required>
                                    <button type="button" class="btn-hide-password" id="btn-hide-ConfirmPassword"><i class="bi bi-eye"></i></button>
                                </div>
                            </div>

                            <p class="text-danger d-none" id="mdp-oublie-error"></p>
                            <p class="text-success d-none" id="mdp-oublie-succes"></p>
                        </form>

                        <div class="text-center">
                            <button type="button" id="btn-mdp-oublie-envoie" class="btn btn-cx-form">Réinitialiser le mot de passe</button>

                            <p class="mt-3 mb-0">Vous vous souvenez de votre mot de passe ? <br>
                            <a href="/connexion" onclick="route(event)" class="btn btn-redirection-inscription-form mt-2">Se connecter</a></p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

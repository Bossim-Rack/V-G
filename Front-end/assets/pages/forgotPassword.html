<section class="cx-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="cx-form">
                    <div class="cx-header text-center py-3">
                        <h2 class="cx-title">Mot de passe oublié</h2>
                    </div>
                    <div class="cx-body p-4">

                        <p class="text-center">Renseignez l'email de votre compte : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>

                        <form id="mdp-oublie-form">
                            <div class="mb-3">
                                <label for="mdp-Email" class="form-label">Identifiant / Email :</label>
                                <input type="email" name="email" id="mdp-Email" class="form-control" autocomplete="email" required>
                            </div>

                            <p class="text-danger d-none" id="mdp-oublie-error" role="alert"></p>
                            <p class="text-success d-none" id="mdp-oublie-succes" role="status"></p>
                        </form>

                        <div class="text-center">
                            <button type="button" id="btn-mdp-oublie-envoie" class="btn btn-cx-form">Recevoir le lien</button>

                            <p class="mt-3 mb-0">Vous vous souvenez de votre mot de passe ? <br>
                            <a href="/connexion" onclick="route(event)" class="btn btn-redirection-inscription-form mt-2">Se connecter</a></p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

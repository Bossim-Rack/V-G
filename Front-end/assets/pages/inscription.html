<section class="inscription-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="inscription-form">

          <div class="inscription-header text-center py-3">
            <h2 class="inscription-title">Inscription</h2>
          </div>

          <div class="inscription-body p-4">
            <form id="inscriptionForm">

              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label for="ins-Nom" class="form-label">Nom :</label>
                  <input type="text" id="ins-Nom" name="nom" class="form-control" required>
                </div>
                <div class="col-6">
                  <label for="ins-PreNom" class="form-label">Prénom :</label>
                  <input type="text" id="ins-PreNom" name="prenom" class="form-control" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="ins-Email" class="form-label">Adresse mail :</label>
                <input type="email" id="ins-Email" name="email" class="form-control" required>
              </div>

              <div class="mb-3">
                <label for="ins-Telephone" class="form-label">N° de GSM :</label>
                <input type="tel" id="ins-Telephone" name="telephone" class="form-control" placeholder="06 12 34 56 78" autocomplete="tel" required>
              </div>

              <div class="mb-3">
                <label for="ins-Adresse" class="form-label">Adresse postale :</label>
                <input type="text" id="ins-Adresse" name="adresse" class="form-control" placeholder="Numéro, rue, code postal, ville" autocomplete="street-address" required>
                <small class="text-muted">Elle sera utilisée pour pré-remplir vos futures commandes.</small>
              </div>

              <div class="mb-3">
                <label for="ins-Password" class="form-label">Mot de passe :</label>
                <div class="contain-Password-input">
                    <input type="password" id="ins-Password" name="Password" class="form-control" required>
                    <button type="button" class="btn-hide-password" id="btn-hide-Password" aria-label="Afficher ou masquer le mot de passe"><i class="bi bi-eye"></i></button>
                </div>
                <div id="strength-bar" class="ins-strength"> </div>
                <ul class="small text-muted mb-0 mt-2 ps-3" id="ins-password-regles" aria-live="polite">
                  <li data-critere="longueur">10 caractères minimum</li>
                  <li data-critere="majuscule">une majuscule</li>
                  <li data-critere="minuscule">une minuscule</li>
                  <li data-critere="chiffre">un chiffre</li>
                  <li data-critere="special">un caractère spécial (! ? @ # ...)</li>
                </ul>

              </div>

              <div class="mb-4">
                <label for="ins-ConfirmPassword" class="form-label">Confirmer le mot de passe :</label>
                <div class="contain-ConfirmPassword-input">
                    <input type="password" id="ins-ConfirmPassword" name="ConfirmPassword" class="form-control" required>
                    <button type="button" class="btn-hide-password" id="btn-hide-ConfirmPassword" aria-label="Afficher ou masquer la confirmation"><i class="bi bi-eye"></i></button>
                </div>

              </div>

              <div class="alert alert-danger d-none" id="ins-erreur" role="alert"></div>
              <div class="alert alert-success d-none" id="ins-succes" role="status"></div>

              <div class="text-center">
                <button type="button" class="btn btn-connexion btn-lg" id="btn-inscription-envoie">Inscription</button>
              </div>

            </form>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toutes les URL qui ne sont pas un fichier sont envoyées à Symfony
        FallbackResource /index.php
    </Directory>


    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

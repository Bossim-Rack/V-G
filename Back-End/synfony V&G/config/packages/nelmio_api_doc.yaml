nelmio_api_doc:
    documentation:
        info:
            title: Vite & Gourmand API
            description: API du traiteur Vite & Gourmand (menus, commandes, avis, comptes).
            version: 1.0.0
        components:
            securitySchemes:
                X-AUTH-TOKEN:
                    type: apiKey
                    name: X-AUTH-TOKEN
                    in: header
        security:
            - X-AUTH-TOKEN: [ ]
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
